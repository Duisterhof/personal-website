<!doctype html>
<html lang="en">
<head>
  <base href="/supersurfer/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#edf3f5"><title>SuperSurfer · Workflow playground</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 23C11 23 10 8 18 8c6 0 5 10 12 10M3 29c10 0 10-15 19-15 5 0 5 8 9 8' fill='none' stroke='%232975b9' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/monaco/editor.css"><link rel="stylesheet" href="vendor/pdfjs/text-layer.css"><link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar glass">
    <button class="brand" data-action="home" aria-label="SuperSurfer home"><svg viewBox="0 0 32 32"><path d="M3 22C11 22 10 8 18 8c6 0 5 10 12 10M3 28c10 0 10-15 19-15 5 0 5 8 9 8"/></svg><b>SuperSurfer</b></button>
    <span class="top-separator"></span>
    <nav class="workflow-switch" aria-label="Workflows"><button data-workflow="writing">Writing</button><button data-workflow="research">Research</button><button data-workflow="coding">Coding</button></nav>
    <span class="demo-label"><i></i> Interactive demo</span>
    <div class="top-actions"><button data-action="tour" class="quiet">Try it</button><button data-action="theme" aria-label="Toggle theme" title="Toggle light / dark theme">◐</button><button data-action="reset" class="quiet" title="Restore sample workspace">Reset</button></div>
  </header>
  <div class="shell">
    <aside id="sidebar" class="glass sidebar" aria-label="Project navigation">
      <div class="side-heading"><span>WORKSPACE</span><button data-action="sidebar" title="Collapse sidebar" aria-label="Collapse sidebar">‹</button></div>
      <div class="workspace-title">Your ideas, in motion.</div>
      <div id="project-nav"></div>
      <details open class="file-section"><summary>Files <button data-action="upload" title="Import files" aria-label="Import files">＋</button></summary><div id="file-tree"></div></details>
      <div id="left-drop" class="drop-zone" data-zone="sidebar">Drop a panel here</div>
      <div id="sidebar-panels" class="panel-stack"></div>
      <div class="sidebar-bottom"><span class="sample-dot"></span><span>Sample workspace · browser only</span></div>
    </aside>
    <div class="splitter sidebar-split" role="separator" aria-label="Resize sidebar" aria-orientation="vertical" tabindex="0"></div>
    <main id="workspace">
      <header class="page-bar glass"><button id="show-sidebar" data-action="sidebar" title="Show sidebar" aria-label="Show sidebar" hidden>☰</button><div class="page-title"><span id="project-name"></span><b id="task-name"></b></div><nav id="page-tabs" aria-label="Task pages"></nav><div class="page-tools"><button data-action="add-page" title="Add page">＋ Page</button><button data-action="add-panel">＋ Panel</button><button id="arrange" data-action="arrange">Arrange</button><button data-action="chat" title="Toggle chat" aria-label="Toggle chat">◫</button></div></header>
      <div id="main-drop" class="drop-zone" data-zone="main">Drop a panel on this page</div>
      <div id="panels" class="panels"></div>
    </main>
    <div class="splitter chat-split" role="separator" aria-label="Resize chat" aria-orientation="vertical" tabindex="0"></div>
    <aside id="chat" class="glass chat" aria-label="Agent chat">
      <details class="agent-list"><summary>Agents · <span id="agent-count">1</span><button data-action="new-agent">＋ New</button></summary><div id="agents"></div></details>
      <header class="chat-heading"><span class="agent-icon">✧</span><div><b id="agent-name"></b><span class="agent-subtitle">Task conversation · demo</span></div><button id="lock-agent" data-action="lock" title="Keep this agent while navigating" aria-label="Lock agent">♧</button><button data-action="chat-focus" title="Fullscreen chat" aria-label="Fullscreen chat">⤢</button><button data-action="chat" title="Close chat" aria-label="Close chat">×</button></header>
      <details class="deliverables"><summary>Plan &amp; deliverables <span id="plan-count"></span></summary><div id="plan"></div></details>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="chat-suggestions" class="chat-suggestions"></div>
      <form id="composer" class="composer"><div id="context-chips"></div><label class="sr-only" for="message">Message your agent</label><textarea id="message" rows="1" placeholder="Ask your agent…"></textarea><div class="composer-controls"><label><span class="sr-only">Permission</span><select id="permission"><option>Approve for me</option><option>Ask</option><option>YOLO</option></select></label><span class="control-spacer"></span><label><span class="sr-only">Model</span><select id="model"><option>GPT-6.1 Sol</option><option>GPT-6 Astra</option></select></label><label><span class="sr-only">Effort</span><select id="effort"><option>High</option><option>Medium</option><option>Extra high</option></select></label><button type="submit" class="send" title="Send" aria-label="Send message">↑</button></div></form>
      <div class="chat-footnote">Demo replies · no live agents or GPU jobs</div>
    </aside>
  </div>
  <input type="file" id="file-input" multiple hidden>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
